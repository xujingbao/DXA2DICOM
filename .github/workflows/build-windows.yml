name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name DXA2DICOM
          --paths . dxa_converter/__main__.py

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/DXA2DICOM -DestinationPath DXA2DICOM-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DXA2DICOM-windows
          path: DXA2DICOM-windows.zip
          if-no-files-found: error
