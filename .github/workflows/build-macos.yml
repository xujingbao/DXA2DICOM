name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name DXA2DICOM
          --osx-bundle-identifier com.dxa.dicomconverter
          --paths . dxa_converter/__main__.py

      - name: Show binary architecture
        run: |
          lipo -archs dist/DXA2DICOM.app/Contents/MacOS/DXA2DICOM
          du -sh dist/DXA2DICOM.app

      - name: Set bundle version
        run: |
          PLIST=dist/DXA2DICOM.app/Contents/Info.plist
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "main" ] && VERSION="0.0.0-dev"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      - name: Re-sign ad-hoc
        run: |
          codesign --force --deep --sign - dist/DXA2DICOM.app
          codesign --verify --deep --strict --verbose=2 dist/DXA2DICOM.app

      - name: Package dmg
        run: |
          rm -rf dmgroot && mkdir dmgroot
          cp -R dist/DXA2DICOM.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "DXA2DICOM" -srcfolder dmgroot -ov -format UDZO \
            "DXA2DICOM-macos-${{ matrix.arch }}.dmg"
          ls -lh DXA2DICOM-macos-${{ matrix.arch }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DXA2DICOM-macos-${{ matrix.arch }}
          path: DXA2DICOM-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DXA2DICOM-macos-${{ matrix.arch }}.dmg
